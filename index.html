<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BSO＋走者 練習</title>
<style>
body{margin:0;background:#0b1220;color:white;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;text-align:center}
main{max-width:600px;margin:auto;padding:22px 16px 40px}
h1{font-size:24px;margin:8px 0 22px}
.panel{background:#151e2e;border-radius:22px;padding:20px;margin-bottom:18px}
.bso{display:flex;justify-content:space-around}
.item{width:30%}.letter{font-size:34px;font-weight:800}.value{font-size:72px;font-weight:900;line-height:1.1}
.b{color:#28d17c}.s{color:#ffd43b}.o{color:#ff5555}
.runnerLabel{font-size:17px;color:#b9c2d0;font-weight:700}
#runnerText{font-size:36px;font-weight:900;margin:10px 0 20px}
.field{position:relative;width:190px;height:190px;margin:8px auto 14px}
.base{position:absolute;width:55px;height:55px;border:4px solid white;border-radius:8px;transform:rotate(45deg);background:#263246}
.base span{display:flex;width:100%;height:100%;align-items:center;justify-content:center;transform:rotate(-45deg);font-size:18px;font-weight:800}
.base.on{background:#ffd43b;border-color:#ffd43b;color:#111}
.b2{left:66px;top:2px}.b1{right:2px;top:66px}.b3{left:2px;top:66px}.home{left:66px;bottom:2px;background:#445066}
button{display:block;width:100%;border:0;border-radius:18px;font-weight:900;-webkit-appearance:none;appearance:none}
#next{background:#2878ed;color:white;font-size:27px;padding:21px;margin-top:5px}
#reset{background:#263246;color:#e8edf5;font-size:17px;padding:14px;margin-top:12px}
.note{font-size:13px;color:#9ca8ba;margin-top:18px}
</style>
</head>
<body>
<main>
<h1>⚾ BSO＋走者 ランダム練習</h1>
<div class="panel bso">
 <div class="item"><div class="letter b">B</div><div id="B" class="value">0</div></div>
 <div class="item"><div class="letter s">S</div><div id="S" class="value">0</div></div>
 <div class="item"><div class="letter o">O</div><div id="O" class="value">0</div></div>
</div>
<div class="panel">
 <div class="runnerLabel">走者状況</div>
 <div id="runnerText">走者なし</div>
 <div class="field">
  <div id="base2" class="base b2"><span>二</span></div>
  <div id="base1" class="base b1"><span>一</span></div>
  <div id="base3" class="base b3"><span>三</span></div>
  <div class="base home"><span>本</span></div>
 </div>
</div>
<button id="next" type="button">次の状況</button>
<button id="reset" type="button">リセット</button>
<div class="note">ボタンを押したときだけ次の状況に変わります</div>
</main>
<script>
(function(){
 var states=[
  [0,0,0,"走者なし"],[1,0,0,"一塁"],[0,1,0,"二塁"],[0,0,1,"三塁"],
  [1,1,0,"一・二塁"],[1,0,1,"一・三塁"],[0,1,1,"二・三塁"],[1,1,1,"満塁"]
 ];
 var last=-1;
 function rnd(n){return Math.floor(Math.random()*n);}
 function setBase(id,on){document.getElementById(id).className=document.getElementById(id).className.replace(" on","")+(on?" on":"");}
 function next(){
   var b=rnd(4),s=rnd(3),o=rnd(3),r=rnd(8);
   var code=b*1000+s*100+o*10+r;
   if(code===last){r=(r+1)%8;code=b*1000+s*100+o*10+r;}
   last=code;
   document.getElementById("B").innerHTML=b;
   document.getElementById("S").innerHTML=s;
   document.getElementById("O").innerHTML=o;
   var st=states[r];
   setBase("base1",st[0]);setBase("base2",st[1]);setBase("base3",st[2]);
   document.getElementById("runnerText").innerHTML=st[3];
 }
 function reset(){
   last=-1;
   document.getElementById("B").innerHTML="0";document.getElementById("S").innerHTML="0";document.getElementById("O").innerHTML="0";
   setBase("base1",0);setBase("base2",0);setBase("base3",0);
   document.getElementById("runnerText").innerHTML="走者なし";
 }
 document.getElementById("next").onclick=next;
 document.getElementById("reset").onclick=reset;
})();
</script>
</body>
</html>
